name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool test_screens

      - name: Analyze
        run: flutter analyze --fatal-infos

      # The catalog is generated from the widgets' constructors. If someone
      # changes a widget and forgets to regenerate, the agent composes
      # against a schema the widget no longer matches.
      - name: Generated catalog is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      # Includes the catalog checks (fuzz, semantics audit, catalog.json)
      # and the replay of every recorded Gemini session.
      - name: Test
        run: flutter test

      # No key is passed: anyone can open the published demo, so the build
      # must never carry one.
      - name: Build web
        run: flutter build web --release --base-href /quincena/

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # Publishes the build above to https://diegolopezrm.github.io/quincena/,
  # only from main and only once every check has passed.
  pages:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and one that started is allowed to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
