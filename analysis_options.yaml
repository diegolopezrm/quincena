include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.genui.dart"
    - "lib/genui_catalog.g.dart"
    # With Swift Package Manager, Flutter copies each plugin into
    # build/ios and build/macos, its Dart tests and examples included.
    - "build/**"
    # Schemas of past database versions, written by drift_dev for the
    # migration tests.
    - "test/generated_migrations/**"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
