<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quincena</title>
  <meta name="description" content="Finanzas personales donde cada respuesta es una interfaz. Una demo de genui y genui_gen, hecha en Flutter.">
  <meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0F0E" media="(prefers-color-scheme: dark)">

  <!-- What a shared link shows. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Quincena">
  <meta property="og:description" content="Finanzas personales donde cada respuesta es una interfaz. Una demo de genui y genui_gen, hecha en Flutter.">
  <meta property="og:url" content="https://diegolopezrm.github.io/quincena/">
  <meta property="og:image" content="https://diegolopezrm.github.io/quincena/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quincena">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while Flutter loads, in the app's own colors, and gone on the
       first frame. */
    :root { --canvas: #F2F4F1; --soft: #4A5450; }
    @media (prefers-color-scheme: dark) {
      :root { --canvas: #0C0F0E; --soft: #A7B2AC; }
    }
    html, body { margin: 0; height: 100%; background: var(--canvas); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 240ms ease;
    }
    #splash .logo { display: block; width: 220px; max-width: 75vw; height: auto; }
    #splash .what { color: var(--soft); font-size: 14px; }
    #splash.gone { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Cargando Quincena">
    <picture>
      <source srcset="brand/quincena-logo-on-dark.svg" media="(prefers-color-scheme: dark)">
      <img class="logo" src="brand/quincena-logo.svg" width="220" height="45" alt="" fetchpriority="high">
    </picture>
    <div class="what">Cargando la demo</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
